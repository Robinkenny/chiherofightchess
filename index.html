<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4a0808" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Kenny 戰棋求生 — 百將追擊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <h1>Kenny 戰棋求生</h1>
        <p class="subtitle">即時 3D 對戰 · 操控 Kenny 閃避百將，升級至 20 級即勝利</p>
      </header>
      <main class="layout">
        <div class="canvas-wrap canvas-wrap--3d">
          <canvas id="game"></canvas>
          <div id="joystick" class="joystick" aria-label="移動搖桿">
            <div id="joy-stick" class="joy-stick"></div>
          </div>
          <div id="overlay" class="overlay hidden"></div>
        </div>
        <aside id="sidebar" class="sidebar"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
